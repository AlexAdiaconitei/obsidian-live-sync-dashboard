packages:
  - .

# Supply-chain policy: versions must be published at least 7 days (in minutes).
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Exceptions need a reason and a removal date.
minimumReleaseAgeExclude: []

saveExact: true
savePrefix: ""

# Reject versions whose provenance is weaker than an earlier release.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600

engineStrict: true

# Install scripts stay disabled; native binaries come from optional platform packages.
allowBuilds:
  esbuild: false

overrides:
  pouchdb-core>uuid: 11.1.1
  pouchdb-utils>uuid: 11.1.1
  # Security fixes the dependants' ranges do not reach yet (GHSA-gfr2-rv44-r23c, GHSA-g3hv-75wg-m249).
  markdown-it: 14.3.3
  minimatch: 11.0.9
