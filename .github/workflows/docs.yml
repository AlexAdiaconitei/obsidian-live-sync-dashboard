name: Docs

# The documentation site lives in docs/site and is its own pnpm project: it does not share the
# application's lockfile, and nothing here installs the app.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: docs/site/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: docs/site/pnpm-lock.yaml

      # docs/site/pnpm-workspace.yaml is this project's workspace root and carries its
      # supply-chain policy, so no --ignore-workspace.
      - run: pnpm install --frozen-lockfile
      - run: pnpm types:check

      # A project site is served from /<repo>, so the build has to be told.
      - run: pnpm build
        env:
          DOCS_BASE_PATH: /${{ github.event.repository.name }}
          DOCS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # A reference that starts at the server root would 404 under the base path.
      - name: Check nothing escapes the base path
        run: |
          escaped=$(grep -rhoE '(src|href)="/[^"]*"' out --include='*.html' \
            | grep -vE '"/'"${GITHUB_REPOSITORY#*/}"'/' || true)
          if [ -n "$escaped" ]; then
            echo "::error::references outside the base path:"
            echo "$escaped" | sort -u | head -20
            exit 1
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        with:
          path: docs/site/out

  deploy:
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
